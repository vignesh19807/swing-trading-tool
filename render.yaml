# ==============================================================================
# Swing Trading Intelligence Platform — Render Blueprint Specification
# ==============================================================================
# Defines the Staging Web Service as a stateless Docker container.
# Database storage is provided externally by Neon Serverless PostgreSQL 16.
#
# OPERATIONAL RULES (Render Free Web Service):
#   1. Plan is locked to 'free' (₹0/month target).
#   2. No persistent disk attached; container is completely stateless.
#   3. DATABASE_URL must be configured in Render dashboard / environment secrets.
#   4. Service spins down after 15 minutes of inactivity; wakes up on incoming request.
# ==============================================================================

services:
  - type: web
    name: swing-trading-staging-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: https://swing-trading-staging.vercel.app,http://localhost:5173,http://localhost:3000
      - key: PYTHONUTF8
        value: "1"
      - key: HISTORY_YEARS
        value: "2"
      - key: MARKET_TIMEZONE
        value: Asia/Kolkata
      - key: ADMIN_API_KEY
        generateValue: true
